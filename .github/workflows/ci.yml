name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: make install

      - name: Lint, typecheck, test
        run: make check

      - name: Run live demo
        run: uv run --frozen python demo/run_demo.py

      - name: Check media source and release artifacts
        run: |
          uv run --frozen --with pillow==12.3.0 --with imageio-ffmpeg==0.6.0 python -m mypy --strict src docs/render_demo.py
          uv run --frozen --with pillow==12.3.0 --with imageio-ffmpeg==0.6.0 python -m docs.render_demo --check
