[project]
name = "lumon"
version = "0.1.0"
description = "Attack-path intervention optimizer with bypass hypothesis generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "PyYAML>=6",
    "networkx",
    "numpy",
    "ortools",
    "jinja2",
    "typer",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lumon"]

# ---------------------------------------------------------------------------
# ruff — lint and format
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy — strict, over source and tests alike
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true

# `networkx` ships no py.typed marker, and `lumon.io.nx_adapter` imports it. The
# override is scoped to that one module deliberately — never a global
# `ignore_missing_imports`, which would silently loosen type checking for every
# dependency. `ortools` needs the same treatment when the solver task imports it.
[[tool.mypy.overrides]]
module = ["networkx.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest and coverage
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
    "--strict-markers",
    "--strict-config",
]

[tool.coverage.run]
source = ["src/lumon"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
